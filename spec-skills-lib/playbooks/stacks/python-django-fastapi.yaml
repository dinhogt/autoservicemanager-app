id: "python-django-fastapi"
name: "Python + Django or FastAPI"
languages: ["Python"]
frameworks: ["Django", "FastAPI"]
package_manager: "pip / uv"
test_runner: "pytest"
lint: "ruff"
build: "python -m build"
directory_conventions:
  source: "app/ or src/"
  tests: "tests/"
  docs: "docs/"
commands:
  test: "pytest"
  lint: "ruff check ."
  build: "python -m build"
observability_defaults:
  metrics: ["prometheus"]
  tracing: "opentelemetry"
security_audit_commands: ["pip-audit"]
