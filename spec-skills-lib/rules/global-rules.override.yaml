technologies:
  stack_profile: "nestjs-next-react"
  cloud_preference: "aws-exception"
  languages: ["TypeScript"]
  frameworks: ["NestJS"]
  datastores: ["MySQL", "DynamoDB"]
  tooling: ["Prisma", "SQS", "SNS"]

architecture:
  style: "microservices"
  boundaries:
    - "api-gateway"
    - "os-service"
    - "billing-service"
    - "execution-service"
    - "auth-lambda"
  patterns:
    - "hexagonal"
    - "saga"
    - "event-driven"

quality:
  test_coverage_target: 90
  lint_required: true

flow_config:
  active_flow: "complex-flow"
  complexity_profile: "high"
  opc_mode: false
