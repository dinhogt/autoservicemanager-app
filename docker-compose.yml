services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: autoservicemanager
      MYSQL_USER: app
      MYSQL_PASSWORD: appsecret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init-grants.sql:/docker-entrypoint-initdb.d/init-grants.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-prootsecret",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    # Override ENTRYPOINT (docker-entrypoint.sh ignores args and starts the API).
    entrypoint: ["prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: mysql://app:appsecret@mysql:3306/autoservicemanager
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://app:appsecret@mysql:3306/autoservicemanager
      JWT_SECRET: docker-compose-dev-jwt-secret-min-16-chars
      WEBHOOK_SECRET: docker-compose-dev-webhook-secret-min-16
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: autoservicemanager
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@autoservice.local}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy

volumes:
  mysql_data:
  mongo_data:
