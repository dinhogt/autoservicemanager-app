name: Publish domain-shared

# Publica @dinhogt/domain-shared no GitHub Packages a partir deste repo (standalone).
# Tag: domain-shared-v0.1.0 (versão deve bater com packages/domain-shared/package.json)
# Escopo npm = owner GitHub (dinhogt). Plano FIAP citava @autoservicemanager/domain-shared.

on:
  push:
    tags:
      - 'domain-shared-v*'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite publish para confirmar publicação manual da versão em package.json'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name == 'push' || github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@dinhogt'

      - name: Install (workspace root)
        run: yarn install --frozen-lockfile

      - name: Test & build domain-shared
        working-directory: packages/domain-shared
        run: yarn test && yarn build

      - name: Publish
        working-directory: packages/domain-shared
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
