# Configuração do cluster kind para demo local (porta 30080 exposta no host).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: autoservice-local
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
