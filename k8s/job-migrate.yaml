apiVersion: batch/v1
kind: Job
metadata:
  name: autoservice-migrate
  namespace: autoservice
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: autoservice-migrate
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: migrate
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/autoservice-dev-api:latest
          command: ["prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: autoservice-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
