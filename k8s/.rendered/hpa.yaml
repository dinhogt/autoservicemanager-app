apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: autoservice-api-hpa
  namespace: autoservice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: autoservice-api
  minReplicas: 1
  maxReplicas: 5
  # Réplicas sobem/descem só conforme CPU média vs request (70%).
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # Sobe quando CPU > 70%. Janela curta evita reação a spike único.
      stabilizationWindowSeconds: 15
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Desce quando CPU < 70%. Após stabilization, permite voltar a 1 de uma vez.
      stabilizationWindowSeconds: 30
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
