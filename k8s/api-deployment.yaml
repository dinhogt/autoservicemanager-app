apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoservice-api
  namespace: autoservice
  labels:
    app: autoservice-api
spec:
  # Réplicas controladas pelo HPA (k8s/hpa.yaml). Não fixar aqui.
  selector:
    matchLabels:
      app: autoservice-api
  template:
    metadata:
      labels:
        app: autoservice-api
    spec:
      serviceAccountName: autoservice-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/autoservice-dev-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: autoservice-config
            - secretRef:
                name: autoservice-secrets
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: AWS_XRAY_DAEMON_ADDRESS
              value: "$(HOST_IP):2000"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
